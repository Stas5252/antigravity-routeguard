name: build-release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: routeguard-release-main
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.23.x'

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter '*.ps1' | ForEach-Object {
            Write-Host "Parsing $($_.FullName)"
            [void][scriptblock]::Create((Get-Content $_.FullName -Raw))
          }

      - name: Test eligibility signatures
        shell: pwsh
        run: ./tests/eligibility-signatures.ps1

      - name: Test, vet and build authenticated SOCKS bridge
        shell: pwsh
        run: |
          go test ./...
          go vet ./...
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags "-s -w" -o dist/agbridge.exe ./bridge

      - name: Build pinned Antigravity proxy injector from source
        shell: pwsh
        run: |
          git clone https://github.com/yuaotian/antigravity-proxy.git upstream
          cd upstream
          git checkout 32785d2098c9a07c6b7060f47d04a17ac0e5a431
          ./build.ps1 -Config Release -Arch x64 -SkipTests
          Copy-Item output/ide/version.dll ../dist/version.dll

      - name: Package
        shell: pwsh
        run: |
          Copy-Item AGRouteGuard.ps1 dist/AGRouteGuard.ps1
          Copy-Item scripts/Start-Bridge.ps1 dist/Start-Bridge.ps1
          Copy-Item Install.cmd dist/Install.cmd
          Copy-Item Status.cmd dist/Status.cmd
          Copy-Item Restore.cmd dist/Restore.cmd
          Copy-Item Report.cmd dist/Report.cmd
          Copy-Item Launch.cmd dist/Launch.cmd
          Copy-Item LaunchProduction.cmd dist/LaunchProduction.cmd
          Copy-Item README.md dist/README.md
          Copy-Item THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
          Copy-Item LICENSE dist/LICENSE

          Get-ChildItem dist -File | Sort-Object Name | ForEach-Object {
            "$(($_ | Get-FileHash -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/MANIFEST.sha256 -Encoding ascii

          Compress-Archive -Path dist/* -DestinationPath AGRouteGuard-win-x64.zip -Force
          (Get-FileHash AGRouteGuard-win-x64.zip -Algorithm SHA256).Hash.ToLower() + '  AGRouteGuard-win-x64.zip' | Set-Content SHA256SUMS.txt -Encoding ascii

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AGRouteGuard-win-x64
          path: |
            AGRouteGuard-win-x64.zip
            SHA256SUMS.txt

      - name: Publish/update rolling GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'routeguard-latest'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f $tag $env:GITHUB_SHA
          git push origin "refs/tags/$tag" --force

          gh release view $tag *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)
          if ($releaseExists) {
            gh release upload $tag AGRouteGuard-win-x64.zip SHA256SUMS.txt --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Failed to upload rolling release assets.' }
            gh release edit $tag --target $env:GITHUB_SHA --title 'AG RouteGuard latest' --notes 'Rolling Windows x64 build from main. Use SHA256SUMS.txt to verify the ZIP.' --latest
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update rolling release metadata.' }
          } else {
            gh release create $tag AGRouteGuard-win-x64.zip SHA256SUMS.txt --target $env:GITHUB_SHA --title 'AG RouteGuard latest' --notes 'Rolling Windows x64 build from main. Use SHA256SUMS.txt to verify the ZIP.' --latest
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create rolling release.' }
          }
